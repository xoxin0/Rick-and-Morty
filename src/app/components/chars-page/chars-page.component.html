<app-header-navbar></app-header-navbar>
<div class="container-characters-page">
  <img
    ngSrc="assets/png-character-page.png"
    alt="png-char-page"
    width="600"
    height="200"
    priority
    class="character-page-image"
  >

  <div class="filter-container">
    <div class="search-box">
      <input
        type="text"
        placeholder="Filter by name..."
        class="input-filter-name"
        [(ngModel)]="nameFilter"
        (input)="applyFilters()"
      >
    </div>

    <div class="filter-species">
      <select
        name="species"
        [(ngModel)]="speciesFilter"
        (change)="applyFilters()"
      >
        <option value="">Species</option>
        <option value="human">Human</option>
        <option value="alien">Alien</option>
      </select>
    </div>

    <div class="filter-gender">
      <select
        name="gender"
        [(ngModel)]="genderFilter"
        (change)="applyFilters()"
      >
        <option value="">Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="genderless">Genderless</option>
        <option value="unknown">Unknown</option>
      </select>
    </div>

    <div class="filter-status">
      <select
        name="status"
        [(ngModel)]="statusFilter"
        (change)="applyFilters()"
      >
        <option value="">Status</option>
        <option value="alive">Alive</option>
        <option value="dead">Dead</option>
        <option value="unknown">Unknown</option>
      </select>
    </div>
  </div>

  <div class="characters-list">
    <div
      class="character-container"
      *ngFor="let character of filteredCharacters"
      (click)="_navigateService.navigateToCharacterDetails(character.id)"
    >
      <div class="character-image">
        <img
          ngSrc="{{ character.image }}"
          alt="character-image"
          width="240"
          height="200"
        >
      </div>

      <div class="character-info">
        <h2 class="character-name">{{ character.name }}</h2>
        <p class="character-species">{{ character.species }}</p>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
